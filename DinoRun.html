<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827"><title>DINORUN — مغامرة الديناصور</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;display:grid;place-items:center;min-height:100svh;padding:16px}.app{width:min(960px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{font-size:clamp(22px,5vw,34px);font-weight:900;letter-spacing:1px}.brand span{color:#a3e635}.sub{color:#a8b7cb;font-size:13px}.hud{display:flex;gap:8px}.pill{background:#172338;border:1px solid #2a3b55;border-radius:12px;padding:9px 13px;font-weight:800;white-space:nowrap}.game{position:relative;border:1px solid #2c405d;border-radius:20px;overflow:hidden;box-shadow:0 24px 80px #0008;background:#bcecff}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#09132299;padding:20px}.overlay.hidden{display:none}.panel{background:#101b2bea;border:1px solid #ffffff24;border-radius:20px;padding:24px;max-width:420px;box-shadow:0 12px 50px #0005}.panel h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px)}.panel p{color:#c0cee0;line-height:1.7;margin:8px 0 18px}.btn{border:0;border-radius:13px;padding:13px 22px;background:#a3e635;color:#17220c;font-size:16px;font-weight:900;cursor:pointer}.btn:active{transform:scale(.97)}.controls{display:flex;justify-content:center;gap:12px;margin-top:13px}.control{flex:1;max-width:220px;padding:16px;border-radius:14px;border:1px solid #30435e;background:#172338;color:white;font-size:16px;font-weight:800;touch-action:manipulation}.hint{text-align:center;color:#8ea2bc;font-size:12px;margin-top:12px}
</style></head><body><main class="app"><header><div><div class="brand">DINO<span>RUN</span> 🦖</div><div class="sub">اركض، اقفز، وحطّم رقمك القياسي!</div></div><div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🏆 <span id="best">0</span></div></div></header>
<div class="game"><canvas id="game" width="960" height="420" aria-label="لعبة جري الديناصور"></canvas><div class="overlay" id="overlay"><div class="panel"><h1 id="title">مستعد للتحدي؟ 🦖</h1><p id="message">اقفز فوق الصبار وتفادَ العقبات. كلما استمريت، زادت السرعة!</p><button class="btn" id="start">ابدأ اللعب ▶</button></div></div></div>
<div class="controls"><button class="control" id="jump">⬆️ اقفز</button><button class="control" id="pause">⏸ إيقاف مؤقت</button></div><div class="hint">التحكم: المس الشاشة أو اضغط Space / ↑ للقفز • P للإيقاف المؤقت</div></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause');
let best=0;try{best=+(localStorage.getItem('dinorun-best')||0)}catch{}bestEl.textContent=best;
const ground=342;let running=false,paused=false,over=false,score=0,speed=6,frame=0,obstacles=[],clouds=[],dust=[],last=0;
const dino={x:105,y:ground-58,w:52,h:58,vy:0,grounded:true};
function reset(){score=0;speed=6;frame=0;obstacles=[];clouds=[];dust=[];dino.y=ground-dino.h;dino.vy=0;dino.grounded=true;for(let i=0;i<5;i++)clouds.push({x:i*230+80,y:45+Math.random()*95,s:22+Math.random()*24})}
function jump(){if(!running){if(over){reset()}running=true;paused=false;over=false;overlay.classList.add('hidden')}if(paused||!dino.grounded)return;dino.vy=-15.5;dino.grounded=false}
function end(){running=false;over=true;const final=Math.floor(score);if(final>best){best=final;bestEl.textContent=best;try{localStorage.setItem('dinorun-best',best)}catch{}title.textContent='رقم قياسي جديد! 🏆'}else title.textContent='انتهت الجولة! 💥';message.textContent='نتيجتك '+final+' نقطة. جرّب مرة أخرى وحاول تحطيم رقمك!';startBtn.textContent='العب مرة أخرى ↻';overlay.classList.remove('hidden')}
function togglePause(){if(over)return;if(!running){return}paused=!paused;if(paused){title.textContent='استراحة قصيرة ⏸';message.textContent='خذ نفسًا واستعد للجولة التالية.';startBtn.textContent='كمّل اللعب ▶';overlay.classList.remove('hidden')}else overlay.classList.add('hidden')}
startBtn.addEventListener('click',()=>{if(paused){paused=false;overlay.classList.add('hidden');return}reset();running=true;over=false;overlay.classList.add('hidden')});document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});pauseBtn.addEventListener('click',togglePause);c.addEventListener('pointerdown',e=>{if(e.target===c)jump()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}if(e.code==='KeyP')togglePause();if(e.code==='Enter'&&!running){reset();running=true;over=false;overlay.classList.add('hidden')}});
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function drawDino(){let x=dino.x,y=dino.y;ctx.fillStyle='#203b2a';ctx.fillRect(x+7,y+17,34,35);ctx.fillRect(x+27,y+2,27,25);ctx.fillRect(x+43,y+16,13,9);ctx.fillRect(x,y+28,13,9);ctx.fillStyle='#b8f36b';ctx.fillRect(x+43,y+8,5,5);ctx.fillStyle='#203b2a';ctx.fillRect(x+13,y+48,10,10);ctx.fillRect(x+31,y+48,10,10);ctx.fillStyle='#365a3a';ctx.fillRect(x+16,y+23,14,9)}
function drawCactus(o){ctx.fillStyle='#237447';ctx.fillRect(o.x+8,ground-o.h,15,o.h);ctx.fillRect(o.x,ground-o.h+17,10,7);ctx.fillRect(o.x,ground-o.h+17,6,20);ctx.fillRect(o.x+21,ground-o.h+27,11,7);ctx.fillRect(o.x+27,ground-o.h+27,6,18);ctx.fillStyle='#48a66b';ctx.fillRect(o.x+11,ground-o.h+3,3,o.h-5)}
function drawBird(o){let flap=Math.sin(frame*.22)*8;ctx.fillStyle='#3d5067';ctx.fillRect(o.x+8,o.y,26,12);ctx.fillRect(o.x+28,o.y+2,12,8);ctx.fillRect(o.x+38,o.y+5,7,4);ctx.fillRect(o.x+13,o.y-5-flap,16,5);ctx.fillRect(o.x+4,o.y+7+flap,15,5)}
function paint(){let night=(Math.floor(score/250)%2)===1;let sky=ctx.createLinearGradient(0,0,0,420);sky.addColorStop(0,night?'#142542':'#8ad9f5');sky.addColorStop(1,night?'#526b86':'#e2f8ff');ctx.fillStyle=sky;ctx.fillRect(0,0,960,420);
if(night){ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(805,78,27,0,Math.PI*2);ctx.fill();for(let i=0;i<35;i++){ctx.fillStyle='#fff';ctx.fillRect((i*137)%960,(i*47)%180,2,2)}}else{ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(805,78,30,0,Math.PI*2);ctx.fill()}
clouds.forEach(a=>{ctx.fillStyle=night?'#71839b':'#ffffffb8';ctx.beginPath();ctx.arc(a.x,a.y,a.s*.45,0,7);ctx.arc(a.x+a.s*.45,a.y-8,a.s*.55,0,7);ctx.arc(a.x+a.s,a.y,a.s*.4,0,7);ctx.fill()});
ctx.fillStyle=night?'#263d50':'#9dd7c1';ctx.beginPath();ctx.moveTo(0,ground);for(let x=0;x<=960;x+=80)ctx.lineTo(x,260+Math.sin(x*.012+frame*.002)*25);ctx.lineTo(960,ground);ctx.fill();
rect(0,ground,960,78,night?'#d2d9c7':'#f1edcf');rect(0,ground,960,4,night?'#81948d':'#80b68c');
ctx.strokeStyle=night?'#a3b3a5':'#98bda0';ctx.lineWidth=2;for(let x=-(frame*speed*.6)%80;x<960;x+=80){ctx.beginPath();ctx.moveTo(x,ground+25);ctx.lineTo(x+28,ground+25);ctx.stroke()}
obstacles.forEach(o=>o.type==='bird'?drawBird(o):drawCactus(o));drawDino();
ctx.fillStyle=night?'#e3edf7':'#284354';ctx.font='bold 17px system-ui';ctx.textAlign='left';ctx.fillText(night?'🌙 NIGHT RUN':'☀ DAY RUN',24,34);
}
function update(dt){if(!running||paused)return;frame+=dt;score+=dt*.12*speed;speed=Math.min(13,6+score/280);scoreEl.textContent=Math.floor(score);clouds.forEach(a=>{a.x-=speed*.18*dt;if(a.x<-70){a.x=1010;a.y=35+Math.random()*110}});if(frame>65+Math.random()*55){let bird=score>180&&Math.random()<.27;obstacles.push(bird?{type:'bird',x:1000,y:ground-65-Math.random()*42,w:45,h:18}:{type:'cactus',x:1000,w:33,h:36+Math.random()*30});frame=0}obstacles.forEach(o=>o.x-=speed*dt);obstacles=obstacles.filter(o=>o.x>-70);dino.vy+=.8*dt;dino.y+=dino.vy*dt;if(dino.y>=ground-dino.h){dino.y=ground-dino.h;dino.vy=0;dino.grounded=true}
for(const o of obstacles){let bx=dino.x+8,by=dino.y+7,bw=dino.w-12,bh=dino.h-10,ox=o.x+3,oy=o.type==='bird'?o.y:o.y||ground-o.h,oh=o.type==='bird'?o.h:o.h,ow=o.w;if(bx<ox+ow-5&&bx+bw>ox&&by<oy+oh&&by+bh>oy+3){end();break}}
}
function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;update(dt);paint();requestAnimationFrame(loop)}reset();paint();requestAnimationFrame(loop);
})();
</script></body></html>

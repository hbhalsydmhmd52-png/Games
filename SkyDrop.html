<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SKYDROP — Survival Arena</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bb5c9;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;color:#fff}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 8px #0009}#top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.panel{background:linear-gradient(135deg,#101c29d9,#182a39c7);border:1px solid #ffffff2b;box-shadow:0 8px 28px #0003;backdrop-filter:blur(12px);border-radius:15px;padding:10px 14px}.brand{font-size:12px;letter-spacing:3px;color:#77e5db;font-weight:900}.big{font-size:21px;font-weight:900}.small{font-size:11px;color:#d4e4e9}.statrow{display:flex;gap:8px}.stat{min-width:70px;text-align:center}#center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;max-width:90vw}#message{font-size:clamp(22px,4vw,42px);font-weight:950;letter-spacing:1px}#sub{font-size:13px;color:#e3f6f6;margin-top:7px}#bottom{position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}#healthwrap{width:180px}#healthbar{height:9px;background:#ffffff33;border-radius:20px;overflow:hidden;margin-top:6px}#healthfill{height:100%;width:100%;background:linear-gradient(90deg,#4de2b0,#c5f878);transition:width .2s}#controls{position:absolute;bottom:100px;right:18px;display:flex;gap:10px;pointer-events:auto}button{border:1px solid #ffffff66;background:#112635c9;color:#fff;border-radius:50%;width:64px;height:64px;font-weight:800;box-shadow:0 6px 22px #0003;touch-action:none}button:active{transform:scale(.95);background:#1f6c78}#start{pointer-events:auto;border:0;border-radius:12px;width:auto;height:auto;padding:12px 22px;background:linear-gradient(120deg,#00bda8,#71e0c1);color:#09242c;font-size:15px;margin-top:16px}#stick{position:absolute;bottom:30px;left:28px;width:112px;height:112px;border-radius:50%;border:1px solid #ffffff55;background:#0b253b55;pointer-events:auto;touch-action:none}#nub{position:absolute;width:46px;height:46px;left:32px;top:32px;border-radius:50%;background:#d6ffffa6;border:1px solid white}#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:#eaf8ffbb;white-space:nowrap}#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 5px #000}#cross:before{width:2px;height:14px;left:6px}#cross:after{height:2px;width:14px;top:6px}@media(max-width:600px){.panel{padding:8px 10px}.big{font-size:17px}.stat{min-width:54px}#healthwrap{width:140px}#hint{display:none}#controls{right:16px;bottom:100px}button{width:58px;height:58px}}
</style>
</head>
<body>
<div id="hud">
 <div id="top">
  <div class="panel"><div class="brand">SKYDROP / SURVIVAL ARENA</div><div class="big">جزيرة السحاب</div><div class="small">نموذج لعب ثلاثي الأبعاد</div></div>
  <div class="statrow">
   <div class="panel stat"><div class="small">الناجون</div><div class="big" id="alive">8</div></div>
   <div class="panel stat"><div class="small">النقاط</div><div class="big" id="score">000</div></div>
   <div class="panel stat"><div class="small">المنطقة</div><div class="big" id="zone">100%</div></div>
  </div>
 </div>
 <div id="center"><div id="message">SKYDROP</div><div id="sub">استكشف الجزيرة، اجمع النقاط، وابقَ داخل المنطقة الآمنة.</div><button id="start">ابدأ اللعب</button></div>
 <div id="bottom"><div class="panel" id="healthwrap"><div style="display:flex;justify-content:space-between"><b>الطاقة</b><span id="hptext">100%</span></div><div id="healthbar"><div id="healthfill"></div></div><div class="small" style="margin-top:5px">تحرّك باستمرار لتفادي العواصف</div></div><div class="panel small">DAYLIGHT · 3D WORLD</div></div>
 <div id="stick"><div id="nub"></div></div>
 <div id="controls"><button id="pulse">نبضة<br>طاقة</button><button id="jump">قفز</button></div>
 <div id="hint">WASD للحركة · حرّك الماوس للنظر · Space للقفز · E لنبضة الطاقة</div>
</div><div id="cross"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8d8);scene.fog=new THREE.FogExp2(0x9bc8d8,.0065);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,500);camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff5ff,0x55664c,2.0));
const sun=new THREE.DirectionalLight(0xffedcf,3.2);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;sun.shadow.bias=-.0003;scene.add(sun);
function canvasTex(kind){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');let base=kind==='grass'?'#627b43':kind==='road'?'#454a4b':kind==='wall'?'#b4aa91':kind==='roof'?'#4e6267':'#857b67';x.fillStyle=base;x.fillRect(0,0,256,256);for(let i=0;i<2600;i++){const px=Math.random()*256,py=Math.random()*256;if(kind==='grass'){x.strokeStyle=['#7f9650','#435d38','#a0a65e','#526d3d'][i%4];x.globalAlpha=.35;x.beginPath();x.moveTo(px,py);x.lineTo(px-2,py-4-Math.random()*7);x.stroke()}else{x.globalAlpha=Math.random()*.15;x.fillStyle=i%2?'#fff':'#14191b';x.fillRect(px,py,Math.random()*5+1,Math.random()*4+1)}}x.globalAlpha=1;if(kind==='wall'){for(let y=0;y<256;y+=32){x.strokeStyle='#766f60';x.globalAlpha=.45;x.beginPath();x.moveTo(0,y);x.lineTo(256,y);x.stroke()}}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}
const grassTex=canvasTex('grass');grassTex.repeat.set(32,32);const roadTex=canvasTex('road');roadTex.repeat.set(2,30);const wallTex=canvasTex('wall');wallTex.repeat.set(1,2);const roofTex=canvasTex('roof');
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),new THREE.MeshStandardMaterial({map:grassTex,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const water=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:0x3d8fa7,roughness:.25,metalness:.15}));water.rotation.x=-Math.PI/2;water.position.y=-2.5;scene.add(water);
function mat(color,rough=.8,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
const roadMat=new THREE.MeshStandardMaterial({map:roadTex,roughness:.94}),wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:.86}),roofMat=new THREE.MeshStandardMaterial({map:roofTex,roughness:.8});
const trunkMat=mat(0x594532),leafMats=[mat(0x2d684b),mat(0x3c7d4e),mat(0x62884a)],rockMat=mat(0x777e7b);
function box(parent,w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);box(g,.34*s,2*s,.34*s,trunkMat,0,s,0);for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.ConeGeometry((1.25-i*.22)*s,1.8*s,7),leafMats[(i+Math.floor(Math.random()*3))%3]);m.position.set(0,(1.5+i*.65)*s,0);m.castShadow=true;g.add(m)}scene.add(g)}
function building(x,z,w,d,h){const g=new THREE.Group();g.position.set(x,0,z);box(g,w,h,d,wallMat,0,h/2,0);box(g,w*1.1,.3,d*1.1,roofMat,0,h+.15,0);for(let yy=1.2;yy<h-.3;yy+=1.6){for(let xx=-w/2+.7;xx<w/2-.4;xx+=1.5){const win=box(g,.65,.72,.05,mat(0x355766,.3,.25),xx,yy,d/2+.03);win.castShadow=false;}}box(g,.95,1.8,.08,mat(0x514438),0,.9,d/2+.05);scene.add(g)}
// Island town layout
for(let i=0;i<8;i++){const a=i*Math.PI/4;building(Math.cos(a)*24,Math.sin(a)*24,7+Math.random()*3,7+Math.random()*3,5+Math.random()*5)}
for(let i=0;i<85;i++){const x=(Math.random()-.5)*190,z=(Math.random()-.5)*190;if(Math.hypot(x,z)>34)tree(x,z,.65+Math.random()*.8)}
for(let i=0;i<32;i++){const x=(Math.random()-.5)*170,z=(Math.random()-.5)*170;const r=new THREE.Mesh(new THREE.DodecahedronGeometry(1+Math.random()*2,0),rockMat);r.position.set(x,.4,z);r.scale.y=.6;r.castShadow=true;r.receiveShadow=true;scene.add(r)}
// Curving road strips
for(let i=0;i<4;i++){const r=new THREE.Mesh(new THREE.PlaneGeometry(7,100),roadMat);r.rotation.x=-Math.PI/2;r.rotation.z=i*Math.PI/2;r.position.y=.025;scene.add(r)}
// Player character, original low-poly model with layered materials
function makePerson(color=0x1bb7b1){const g=new THREE.Group();const bodyMat=mat(color,.52),dark=mat(0x263541),skin=mat(0xc58e69),glow=mat(0x8df9ef,.25,.25);const torso=box(g,.8,1.1,.42,bodyMat,0,1.65,0);box(g,.55,.18,.46,dark,0,1.1,0);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),skin);head.position.y=2.42;head.castShadow=true;g.add(head);box(g,.9,.26,.48,dark,0,2.15,0);for(const side of [-1,1]){box(g,.22,.78,.25,bodyMat,side*.55,1.7,0);box(g,.28,.72,.3,dark,side*.25,.52,0)}const pack=box(g,.42,.68,.2,dark,0,1.65,-.32);const badge=box(g,.23,.12,.03,glow,0,1.8,.23);return g}
const player=makePerson(0x1cc9b8);player.position.set(0,0,0);scene.add(player);
const bots=[];for(let i=0;i<7;i++){const b=makePerson([0xf2a64b,0x9d8bff,0xe7f0f3,0xff7b73][i%4]);const a=Math.random()*Math.PI*2,r=18+Math.random()*55;b.position.set(Math.cos(a)*r,0,Math.sin(a)*r);b.userData={angle:Math.random()*6.28,speed:1.1+Math.random()*1.2,tagged:false,phase:Math.random()*5};scene.add(b);bots.push(b)}
// Safe-zone ring
const ringMat=new THREE.MeshBasicMaterial({color:0x65ffe4,transparent:true,opacity:.9});const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.12,8,160),ringMat);ring.rotation.x=Math.PI/2;ring.position.y=.25;scene.add(ring);
const ringWall=new THREE.Mesh(new THREE.CylinderGeometry(1,1,14,96,1,true),new THREE.MeshBasicMaterial({color:0x54e8d4,transparent:true,opacity:.055,side:THREE.DoubleSide,depthWrite:false}));scene.add(ringWall);
const pulseMat=new THREE.MeshBasicMaterial({color:0x7efff0,transparent:true,opacity:.65,wireframe:true});const pulses=[];
let playing=false,score=0,hp=100,elapsed=0,zoneR=100,camYaw=0,camPitch=.22,velY=0,onGround=true;const keys={};let moveTouch={x:0,y:0};const $=id=>document.getElementById(id);
function updateHud(){$('score').textContent=String(score).padStart(3,'0');$('alive').textContent=1+bots.filter(b=>!b.userData.tagged).length;$('zone').textContent=Math.round(zoneR)+'%';$('hptext').textContent=Math.max(0,Math.round(hp))+'%';$('healthfill').style.width=Math.max(0,hp)+'%'}
function start(){playing=true;elapsed=0;score=0;hp=100;zoneR=100;player.position.set(0,0,0);for(const b of bots){b.visible=true;b.userData.tagged=false;const a=Math.random()*Math.PI*2,r=20+Math.random()*48;b.position.set(Math.cos(a)*r,0,Math.sin(a)*r)}$('center').style.display='none';updateHud()}
$('start').onclick=start;
function jump(){if(playing&&onGround){velY=7.4;onGround=false}}
function pulse(){if(!playing)return;const target=bots.filter(b=>!b.userData.tagged).sort((a,b)=>a.position.distanceTo(player.position)-b.position.distanceTo(player.position))[0];if(target&&target.position.distanceTo(player.position)<13){target.userData.tagged=true;target.visible=false;score+=100;const p=new THREE.Mesh(new THREE.IcosahedronGeometry(.7,1),pulseMat);p.position.copy(target.position).add(new THREE.Vector3(0,1,0));p.userData={age:0};scene.add(p);pulses.push(p);updateHud()}else{score+=5;updateHud()}}
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('pulse').addEventListener('pointerdown',e=>{e.preventDefault();pulse()});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='KeyE')pulse();if(e.code==='Enter'&&!playing)start()});addEventListener('keyup',e=>keys[e.code]=false);
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{if(!playing)return;drag={x:e.clientX,y:e.clientY,id:e.pointerId};if(e.pointerType==='mouse'&&renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock()});addEventListener('pointerup',()=>drag=null);addEventListener('pointermove',e=>{if(document.pointerLockElement===renderer.domElement){camYaw-=e.movementX*.003;camPitch=THREE.MathUtils.clamp(camPitch+e.movementY*.002,-.15,.65)}else if(drag&&drag.id===e.pointerId&&e.pointerType!=='mouse'){camYaw-=(e.clientX-drag.x)*.006;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-drag.y)*.003,-.15,.65);drag.x=e.clientX;drag.y=e.clientY}});
const stick=$('stick'),nub=$('nub');let stickActive=false;stick.addEventListener('pointerdown',e=>{stickActive=true;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(stickActive)moveStick(e)});function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),k=Math.min(1,l/42);moveTouch={x:l?dx/l*k:0,y:l?dy/l*k:0};nub.style.left=(32+moveTouch.x*28)+'px';nub.style.top=(32+moveTouch.y*28)+'px'}function stopStick(){stickActive=false;moveTouch={x:0,y:0};nub.style.left='32px';nub.style.top='32px'}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
const clock=new THREE.Clock();const forward=new THREE.Vector3(),right=new THREE.Vector3(),wish=new THREE.Vector3(),camOffset=new THREE.Vector3();
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04);if(playing){elapsed+=dt;zoneR=Math.max(18,100-elapsed*.32);ring.scale.set(zoneR,zoneR,zoneR);ringWall.scale.set(zoneR,1,zoneR);ring.position.set(0,.25,0);ringWall.position.set(0,7,0);
forward.set(-Math.sin(camYaw),0,-Math.cos(camYaw));right.set(Math.cos(camYaw),0,-Math.sin(camYaw));wish.set(0,0,0);if(keys.KeyW||keys.ArrowUp)wish.add(forward);if(keys.KeyS||keys.ArrowDown)wish.sub(forward);if(keys.KeyD||keys.ArrowRight)wish.add(right);if(keys.KeyA||keys.ArrowLeft)wish.sub(right);wish.addScaledVector(right,moveTouch.x);wish.addScaledVector(forward,-moveTouch.y);if(wish.lengthSq()>0){wish.normalize();player.position.addScaledVector(wish,5.8*dt);player.rotation.y=Math.atan2(wish.x,wish.z)}velY-=18*dt;player.position.y+=velY*dt;if(player.position.y<=0){player.position.y=0;velY=0;onGround=true}
player.position.x=THREE.MathUtils.clamp(player.position.x,-118,118);player.position.z=THREE.MathUtils.clamp(player.position.z,-118,118);
for(const b of bots){if(b.userData.tagged)continue;b.userData.angle+=Math.sin(elapsed+b.userData.phase)*dt*.55;const toPlayer=new THREE.Vector3().subVectors(player.position,b.position);const dist=toPlayer.length();if(dist<22){toPlayer.y=0;toPlayer.normalize();b.position.addScaledVector(toPlayer,dt*b.userData.speed*.8);b.rotation.y=Math.atan2(toPlayer.x,toPlayer.z)}else{b.position.x+=Math.sin(b.userData.angle)*dt*b.userData.speed;b.position.z+=Math.cos(b.userData.angle)*dt*b.userData.speed}b.position.x=THREE.MathUtils.clamp(b.position.x,-115,115);b.position.z=THREE.MathUtils.clamp(b.position.z,-115,115);if(dist<2.4)hp-=dt*3}
if(Math.hypot(player.position.x,player.position.z)>zoneR){hp-=dt*5}
for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.userData.age+=dt;p.scale.setScalar(1+p.userData.age*5);p.material.opacity=Math.max(0,.7-p.userData.age*.5);if(p.userData.age>1.4){scene.remove(p);p.geometry.dispose();pulses.splice(i,1)}}
if(hp<=0||bots.every(b=>b.userData.tagged)){playing=false;document.exitPointerLock?.();$('center').style.display='block';$('message').textContent=hp<=0?'انتهت الجولة':'فزت بالجولة!';$('sub').textContent='نقاطك: '+score+' — ابدأ جولة جديدة وحاول تحطّم رقمك.';$('start').textContent='العب مرة أخرى'}
updateHud();
}
camOffset.set(Math.sin(camYaw)*10,4.5+camPitch*5,Math.cos(camYaw)*10);const target=new THREE.Vector3(player.position.x,player.position.y+1.35,player.position.z);camera.position.lerp(target.clone().add(camOffset),1-Math.pow(.001,dt));camera.lookAt(target);
renderer.render(scene,camera)}
tick();
</script>
</body></html>
